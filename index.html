<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c6b42">
  <title>CasaJusta — Cargando</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f2faf5;color:#174d34}
    main{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:clamp(28px,7vw,40px);letter-spacing:-1px}
    .logo{display:grid;place-items:center;width:56px;height:56px;background:#087a48;border-radius:18px;color:white;font-size:32px;box-shadow:0 12px 28px #087a482b}
    p{color:#5a7668;margin:18px 0 24px;font-size:15px}.bar{height:5px;width:min(230px,75vw);background:#d8e9df;border-radius:99px;overflow:hidden;margin:auto}.bar:before{content:"";display:block;width:38%;height:100%;background:#0c9a5d;border-radius:99px;animation:slide 1.2s ease-in-out infinite alternate}
    @keyframes slide{to{transform:translateX(165%)}}@media(prefers-reduced-motion:reduce){.bar:before{animation:none;width:100%}}
    iframe{position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <main><div><div class="brand"><span class="logo" aria-hidden="true">⌂</span><span>CasaJusta</span></div><p>Tu próximo hogar, sin intermediarios.</p><div class="bar" role="progressbar" aria-label="Cargando página principal"></div></div></main>
  <iframe id="precarga" title="Precarga de la página principal" src="./CasaJusta-Mobile.html" tabindex="-1" aria-hidden="true"></iframe>
  <script>
    (() => {
      const inicio = performance.now();
      const minimo = 3000;
      const destino = './CasaJusta-Mobile.html';
      let listo = false;
      let tiempoCumplido = false;
      function continuar() {
        if (listo && tiempoCumplido) window.location.replace(destino);
      }
      const iframe = document.getElementById('precarga');
      iframe.addEventListener('load', () => { listo = true; continuar(); }, { once: true });
      setTimeout(() => { tiempoCumplido = true; continuar(); }, Math.max(0, minimo - (performance.now() - inicio)));
    })();
  </script>
</body>
</html>
